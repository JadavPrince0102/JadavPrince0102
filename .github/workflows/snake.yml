name: Generate snake animation

on:
  # Rebuild twice a day so the snake reflects recent contributions
  schedule:
    - cron: "0 */12 * * *"

  # Lets you trigger it by hand from the Actions tab
  workflow_dispatch:

  # Also rebuild whenever the profile repo is pushed to
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake from contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
